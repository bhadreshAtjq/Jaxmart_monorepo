name: Continuous Integration (CI)

on:
  push:
    branches: [ main, staging, "feature/**", "fix/**" ]
  pull_request:
    branches: [ main, staging ]

jobs:
  backend-ci:
    name: Backend Lint & Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/dummy_db?schema=public"
      JWT_SECRET: "dummy_jwt_secret_for_ci_build_validation_32chars"
      JWT_REFRESH_SECRET: "dummy_refresh_secret_for_ci_build_validation_32chars"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Create Temporary CI .env
        run: |
          echo 'DATABASE_URL="postgresql://postgres:postgres@localhost:5432/dummy_db?schema=public"' > .env
          echo 'JWT_SECRET="dummy_jwt_secret_for_ci_build_validation_32chars"' >> .env

      - name: Install Dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: Validate Prisma Schema
        run: npx prisma validate

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Backend Tests
        run: npm test

  web-ci:
    name: Web Frontend Build & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Lint Codebase
        run: npm run lint

      - name: Type Check & Verify Next.js Production Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.yourdomain.com
