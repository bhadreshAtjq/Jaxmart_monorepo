version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: jaxmart-db-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-YourSecureProductionPassword123}
      POSTGRES_DB: ${POSTGRES_DB:-jaxmart_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-jaxmart_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jaxmart-network

  redis:
    image: redis:7-alpine
    container_name: jaxmart-redis-prod
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jaxmart-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jaxmart-backend-prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./backend/.env
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:4000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - jaxmart-network

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.yourdomain.com}
    container_name: jaxmart-web-prod
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - ./web/.env
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - jaxmart-network

networks:
  jaxmart-network:
    driver: bridge

volumes:
  pgdata_prod:
  redisdata_prod:
